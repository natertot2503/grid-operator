<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Grid Operator</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grid Operator">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e7e8e5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">

<style>
/* VOICE: a control-room shift, calm until it isn't
   IDEA: a high-performance HMI screen (ISA-101 style) — grey when normal, colour only means trouble
   PICTURE: the frequency gauge and the demand/generation trend, then the unit faceplates
   COLOUR and TYPE: HMI greys, process blue for setpoints, yellow/red reserved for alarms; system sans, tabular numbers
   LAYOUT: one phone column; status strip, gauge + trend, alarm line, 2-up faceplates */
:root{color-scheme:light dark;
 --bg:light-dark(#d3d5d1,#1d2023);--pn:light-dark(#e7e8e5,#2a2e32);--ink:light-dark(#1d2124,#e8eaeb);--dim:light-dark(#5b6268,#9aa2a8);
 --ln:light-dark(#b8bbb6,#3d4348);--blue:light-dark(#2a5ea8,#77a3e4);--warn:#e2ad00;--alm:#d42f1f;--ok:light-dark(#3d7a4a,#6fb27c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow-x:clip;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.app{max-width:560px;margin:0 auto;padding:10px 10px max(16px,env(safe-area-inset-bottom));display:grid;gap:8px}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:10px}
.topbar{position:sticky;top:0;z-index:4;background:var(--pn);border-bottom:1px solid var(--ln);box-shadow:0 2px 8px #0002;padding:max(8px,env(safe-area-inset-top)) 10px 8px}
.bari{max-width:560px;margin:0 auto;display:grid;gap:6px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1.3fr);gap:6px;align-items:end}
.stats div{display:grid;line-height:1.1;min-width:0}
.stats .r{text-align:right}
.lbl{font-size:12px;color:var(--dim)}
.stats b{font-size:clamp(14px,4.3vw,20px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:clip}
.stats b.w{color:var(--warn)}.stats b.a{color:var(--alm)}
.ctl{display:flex;gap:6px;align-items:center}
.ctl .ttl{font-weight:800;font-size:14px}
.ctl .note{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:380px){.ctl .ttl{display:none}}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.money{font-size:20px;font-weight:700}
.btn{font:inherit;font-weight:700;min-height:44px;padding:8px 16px;border-radius:8px;border:1px solid var(--ln);background:var(--pn);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.sm{min-height:36px;padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.4}
.btn.slow{background:var(--warn);border-color:var(--warn);color:#1d1600}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.gauge svg{width:100%;display:block}
.fz{font-size:34px;font-weight:800;text-align:center;margin-top:-8px}
.fz.w{color:var(--warn)}.fz.a{color:var(--alm)}
.kv{display:grid;gap:6px}
.kv div{display:flex;justify-content:space-between;gap:6px;font-size:13px;color:var(--dim);border-bottom:1px solid var(--ln);padding-bottom:4px}
.kv b{color:var(--ink);font-size:16px}
.trend{position:relative;height:110px}
.trend canvas{position:absolute;inset:0;width:100%;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--dim);margin-top:4px}
.outlook{margin-top:8px;display:grid;gap:6px}
.olk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;text-align:center}
.olk div{background:var(--bg);border-radius:6px;padding:5px 2px;display:grid;line-height:1.15}
.olk span,.obat{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.olk b{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.olk .need b{color:var(--blue)}
.obat{font-size:13px;height:18px;font-variant-numeric:tabular-nums}
.leg i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px}
.alarm{display:flex;gap:8px;align-items:center;font-size:13.5px;line-height:1.25;height:50px;padding:5px 10px}
#amsg{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0}
.alarm .tag{flex:none;font-size:12px;font-weight:800;padding:2px 7px;border-radius:4px;background:var(--ln);color:var(--ink)}
.alarm.a .tag{background:var(--alm);color:#fff}.alarm.w .tag{background:var(--warn);color:#1d1600}
.alarm.a{animation:fl 1s steps(2) 3}
@keyframes fl{50%{background:color-mix(in srgb,var(--alm) 18%,var(--pn))}}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;position:sticky;top:var(--barh,96px);z-index:3;background:var(--bg);padding:4px 0}
.tab{font:inherit;min-height:48px;border-radius:9px;border:1px solid var(--ln);background:var(--pn);color:var(--ink);display:grid;line-height:1.15;padding:4px;cursor:pointer}
.tab b{font-size:14px}.tab span{font-size:12px;color:var(--dim)}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}.tab.on span{color:#ffffffcc}
.tab:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#units[data-tab=base] [data-t]:not([data-t=base]),#units[data-tab=swing] [data-t]:not([data-t=swing]),#units[data-tab=green] [data-t]:not([data-t=green]){display:none}
.tiegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;text-align:center}
.tiegrid div{background:var(--bg);border-radius:6px;padding:5px 2px;display:grid;line-height:1.15}
.tiegrid span{font-size:12px;color:var(--dim)}.tiegrid b{font-size:17px;font-weight:800;white-space:nowrap}
.pinned{grid-column:1/-1;font-size:12px;color:var(--dim);border-top:1px solid var(--ln);padding-top:6px;margin-top:2px}
.units{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.u{display:grid;gap:4px;align-content:start}
.u .h{display:flex;justify-content:space-between;align-items:center;gap:4px}
.u .nm{font-weight:700;font-size:14px}
.chip{font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;border:1px solid var(--ln);color:var(--dim);white-space:nowrap}
.chip.st{border-color:var(--warn);color:var(--ink);background:color-mix(in srgb,var(--warn) 30%,transparent)}
.chip.trip{background:var(--alm);border-color:var(--alm);color:#fff}
.u .mw{font-size:24px;font-weight:800}
.u .mw small{font-size:13px;font-weight:500;color:var(--dim)}
.u .sp{font-size:13px;color:var(--blue);font-weight:600}
.u input[type=range]{width:100%;height:32px;accent-color:var(--blue);margin:0}
.bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden;border:1px solid var(--ln)}
.bar i{display:block;height:100%;background:var(--blue)}
.note{font-size:12px;color:var(--dim)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tog{font-size:13px}
.shop{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px}
.shop .btn{flex:none;min-width:84px}
.ov{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
.ov.on{display:flex}
.card{max-width:420px;width:100%;background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:20px;display:grid;gap:10px;max-height:90vh;overflow:auto}
.card h2{margin:0;font-size:28px;line-height:1.05}
.card p,.card li{margin:0;font-size:15px}
.card ul{margin:0;padding-left:18px;display:grid;gap:5px}
.learn{padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--blue) 12%,transparent);border-left:4px solid var(--blue)}
.learn p{margin:4px 0 0;font-size:14px}
.how summary{font-size:13px;color:var(--blue);cursor:pointer;min-height:28px;display:flex;align-items:center}
.how p{margin:2px 0 4px;font-size:14px}
.sh{margin:10px 0 0;font-size:18px}
.exph{padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--blue) 14%,transparent);border:1px solid var(--blue)}
.exph h3{margin:0 0 4px;font-size:22px}.exph p,.exph li{font-size:14px}
.fush{padding:10px 12px;border-radius:10px;background:linear-gradient(135deg,#0d1d44,#123a55);color:#e8fbff;border:1px solid #46e0ff}
.fush p{margin:4px 0 0;font-size:14px;color:#cdeff7}.fush .note{color:#a9d8e4}.fush .chip{color:#e8fbff}
.fchk{margin:6px 0;padding-left:4px;list-style:none;font-size:14px}.fchk li{margin:3px 0}
.card.wide{max-width:560px;padding:0;overflow:auto;background:#050a1c;color:#e8fbff;border-color:#1f5a7a}
.win-screen{display:grid;gap:10px;padding:0 0 18px}
.win-screen>*:not(svg){margin-inline:18px}
.city{width:100%;display:block;border-radius:14px 14px 0 0}
.wt{font-size:clamp(30px,8vw,44px);line-height:1.03;margin:4px 0 0;text-wrap:balance;color:#fff}
.ws{margin:0;color:#bfe9f3}
.wgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.wgrid div{background:#0f1f42;border:1px solid #1f3f6a;border-radius:8px;padding:7px 4px;display:grid;text-align:center;line-height:1.15}
.wgrid b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wgrid span{font-size:11px;color:#8fc4d4}
.card.wide .note{color:#8fc4d4}.card.wide .how summary{color:#7ff3ff}.card.wide .btn:not(.pri){background:#0f1f42;color:#e8fbff;border-color:#1f5a7a}
@media(max-width:420px){.wgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.city .win{animation:tw 5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.45}}
.city .blink{animation:bl 1.6s steps(2) infinite}@keyframes bl{50%{opacity:.1}}
.city .plasma{animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{stroke-width:6;opacity:.85}}
.city .spin{animation:sp 3s linear infinite}@keyframes sp{to{stroke-dashoffset:-88}}
.city .pulse{animation:pu 4s ease-in-out infinite;transform-origin:200px 168px}@keyframes pu{50%{opacity:.7;transform:scale(1.05)}}
.city .car{offset-path:path("M-20 0 L420 0");transform:translateY(var(--y));animation:cr linear infinite}@keyframes cr{from{offset-distance:0%}to{offset-distance:100%}}
@media(prefers-reduced-motion:reduce){.city *{animation:none!important}}
.chip.stg1{border-color:var(--ok);color:var(--ok)}.chip.stg3{border-color:var(--warn);color:var(--ink)}
.card .fc{font-weight:700;color:var(--blue)}
.warnp{margin:0;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--warn) 28%,transparent);border-left:4px solid var(--warn);font-size:14px}
@media(prefers-reduced-motion:reduce){.alarm.a{animation:none}}
</style>
</head>
<body>
<header class="topbar"><div class="bari">
  <div class="stats">
    <div><span class="lbl" id="dayl">Day 1</span><b class="num" id="clock">05:00</b></div>
    <div><span class="lbl">Freq Hz</span><b class="num" id="bf">60.00</b></div>
    <div><span class="lbl">Bal MW</span><b class="num" id="bb">0</b></div>
    <div><span class="lbl">Battery</span><b class="num" id="bsoc">50%</b></div>
    <div class="r"><span class="lbl">Bank</span><b class="num" id="money">$0</b></div>
  </div>
  <div class="ctl"><span class="ttl">Grid Operator</span><span class="note num" id="sunl"></span>
    <button class="btn sm" id="build">Build</button><button class="btn sm" id="spd">1×</button><button class="btn sm" id="pause">Pause</button></div>
  <div class="pn alarm" id="alarm"><span class="tag">INFO</span><span id="amsg">System normal</span></div>
</div></header>
<div class="app">

  <div class="pn hero">
    <div class="gauge"><svg viewBox="0 0 200 112" id="gsv"></svg><div class="fz num" id="fz">60.00 Hz</div></div>
    <div class="kv">
      <div>Demand<b class="num" id="kd">0 MW</b></div>
      <div>Generation<b class="num" id="kg">0 MW</b></div>
      <div>Balance<b class="num" id="kb">0 MW</b></div>
      <div>Load shed<b class="num" id="ks">0 MW</b></div>
    </div>
  </div>

  <div class="pn">
    <div class="trend" id="trend"><canvas id="cv"></canvas></div>
    <div class="leg"><span><i style="background:var(--ink)"></i>Demand<span id="lgex"></span></span><span><i style="background:var(--blue)"></i>Your plants (not solar/wind)</span><span>Dashed = next 3 h</span></div>
    <div class="outlook"><div class="olk">
      <div><span>Demand, next hr</span><b id="o-d">+0</b></div>
      <div><span>Solar, next hr</span><b id="o-s">+0</b></div>
      <div class="need"><span>Plants must add</span><b id="o-n">+0</b></div></div>
      <div class="obat" id="o-b">Battery idle</div></div>
  </div>


  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" data-tab="base" role="tab"><b>Base load</b><span class="num" id="tw-base">0 MW</span></button>
    <button class="tab" data-tab="swing" role="tab"><b>Swing</b><span class="num" id="tw-swing">0 MW</span></button>
    <button class="tab" data-tab="green" role="tab"><b>Green</b><span class="num" id="tw-green">0 MW</span></button>
  </div>
  <div class="units" id="units" data-tab="base"></div>
</div>

<div class="ov on" id="ov"><div class="card" id="ovc"></div></div>

<script>
{
const $=id=>document.getElementById(id);
const HPS=0.1;               // game hours per real second (a day ≈ 4 minutes)
const D=500,M=600;           // load damping MW/Hz, system inertia
const TYPES={
  nuc:{name:'Nuclear',min:300,max:600,ramp:6,cost:10,note:'Cheapest power, slowest ramp. Can’t go below 300.'},
  coal:{name:'Coal',min:150,max:400,ramp:20,cost:30,start:25,startCost:5000,note:'Start takes ~25 s. Min 150.'},
  gas:{name:'Gas peaker',min:50,max:300,ramp:30,cost:85,start:6,startCost:1000,note:'Fast but pricey. Start ~6 s.'},
  hydro:{name:'Hydro',min:0,max:250,ramp:80,cost:0,note:'Free and fast, limited water.'},
  gasb:{name:'Gas peaker',min:30,max:200,ramp:30,cost:85,start:6,startCost:800,note:'Fast but pricey. Start ~6 s.'},
  coalb:{name:'Coal',min:100,max:300,ramp:18,cost:30,start:25,startCost:4000,note:'Start takes ~25 s. Min 100.'},
  fus:{name:'Fusion reactor',min:0,max:9000,ramp:90,cost:1,note:'Tokamak fusion plant.'},
  cc:{name:'Combined cycle',min:150,max:450,ramp:12,cost:45,start:45,startCost:8000,note:'Gas turbine + HRSG + steam turbine.'},
  smr:{name:'Small reactor',min:100,max:300,ramp:8,cost:12,start:40,startCost:3000,note:'Cheap baseload, slow ramp. Start ~40 s. Min 100.'}
};
const RES=1300;
const FAM={fus:'fus',cc:'cc',gas:'gas',gasb:'gas',coal:'coal',coalb:'coal',nuc:'nuc',smr:'nuc',hydro:'hydro',res:'hydro',solar:'solar',wind:'wind',bat:'bat'};
const FAMN={fus:'fusion',cc:'combined-cycle units',gas:'gas units',coal:'coal units',nuc:'nuclear units',hydro:'hydro',solar:'solar',wind:'wind',bat:'battery'};
// per-plant engineering upgrades; installed overnight. fx: max/min MW, ramp/cost/start/startCost/water as fractions
const UPG={
  nuc:[{id:'fwp',learn:'A reactor’s heat output is limited partly by how much feedwater can be pushed through the steam generators. Bigger feedwater pumps raise that flow, so the plant can run at a higher licensed power level (a “power uprate”) and send more steam to the turbine.',name:'Upsized feedwater pumps',desc:'Thermal power uprate: more steam to the turbine',fx:{max:60},cost:1.6e6},
       {id:'lpt',learn:'Steam does much of its work expanding through the low-pressure turbine stages. Newer blades with better aerodynamics and tighter seals pull more energy out of the same steam, so you get more MW per unit of fuel.',name:'Low-pressure turbine retrofit',desc:'More electricity from the same steam',fx:{cost:-.2,max:20},cost:1.2e6},
       {id:'lf',learn:'Reactor power is steered with control rods and boron dissolved in the coolant. Better rod-control logic and in-core instruments let the core change power faster without uneven heating that would stress the fuel.',name:'Load-follow control upgrade',desc:'Faster, finer control-rod moves',fx:{ramp:.6},cost:.8e6},
       {id:'rods',learn:'“Gray” rods absorb only part of the neutrons that hit them. They allow gentler power cuts than full-strength rods or big boron changes, so the reactor can turn down further at night. French reactors use them for load following.',name:'Gray control rods',desc:'Lets the reactor run lower overnight',fx:{min:-100},cost:.9e6}],
  coal:[{id:'econ',learn:'An economizer is a heat exchanger in the boiler’s back pass. Flue gas that would have gone up the stack preheats the incoming feedwater, so the furnace burns less coal to make the same steam.',name:'Economizer',desc:'Preheats boiler feedwater with flue-gas heat',fx:{cost:-.15},cost:.6e6},
        {id:'bfp',learn:'Boiler feed pumps have to push water into a boiler that is already at full steam pressure. If they’re maxed out, more coal won’t make more steam. Larger pumps raise that ceiling.',name:'Larger boiler feed pumps',desc:'More steam flow at full load',fx:{max:50},cost:.9e6},
        {id:'mill',learn:'Coal is ground to powder in pulverizer mills before being blown into the burners, and the mills often limit how fast load can change. A spare mill means fuel flow can climb faster.',name:'Extra pulverizer mill',desc:'Fuel delivery keeps up with faster load changes',fx:{ramp:.5},cost:.7e6},
        {id:'ign',learn:'A cold coal burner can’t light on its own; it needs a stable flame first. Natural-gas igniters light the furnace and hold flame quickly, so the unit syncs sooner and wastes less fuel warming up.',name:'Natural-gas igniters',desc:'Warm starts without waiting on the coal flame',fx:{start:-.6},cost:.4e6},
        {id:'burn',learn:'At low load, coal flames get unstable and can blow out, which trips the unit. Low-load burners stage combustion air to keep the flame anchored, so the unit can idle lower instead of shutting down overnight.',name:'Low-load burner retrofit',desc:'Stable flame at lower output',fx:{min:-60},cost:.5e6},
        {id:'bunk',learn:'Bunkers are the silos that hold crushed coal above the mills. More storage means buying in bigger lots and handling fuel less often, a small but steady saving on every MWh.',name:'Larger coal bunkers',desc:'Bigger on-site stockpile, bought in bulk',fx:{cost:-.1},cost:.5e6}],
  gas:[{id:'fog',learn:'A gas turbine’s output depends on how much air mass it moves. A fine mist sprayed into the inlet cools the air as it evaporates, and cooler air is denser, so the same machine makes more power, especially on hot days.',name:'Inlet air fogging',desc:'Cooler, denser intake air',fx:{max:40},cost:.5e6},
       {id:'recup',learn:'A recuperator uses hot turbine exhaust to preheat the compressed air before it reaches the combustor. Less fuel is needed to hit firing temperature, which improves the heat rate.',name:'Recuperator',desc:'Reuses exhaust heat to preheat combustion air',fx:{cost:-.2},cost:.8e6},
       {id:'fuel',learn:'A turbine can only ramp as fast as fuel arrives at pressure. A bigger supply line and a booster compressor hold gas pressure up during fast load increases, so the fuel valve can open harder.',name:'Larger fuel line & gas compressor',desc:'Fuel supply keeps up with fast ramps',fx:{ramp:.5,max:20},cost:.6e6},
       {id:'fast',learn:'A start means purging unburned gas, igniting, spinning up and synchronizing. Better sequencing and starting equipment shorten the purge and acceleration, cutting time, fuel and wear on every start.',name:'Fast-start package',desc:'Shorter purge and ignition sequence',fx:{start:-.5,startCost:-.5},cost:.3e6}],
  cc:[{id:'duct',learn:"Duct burners are extra burners inside the HRSG that fire natural gas into the turbine exhaust, which still has plenty of oxygen. That makes more steam for the steam turbine on hot days or peaks, but the added fuel is used less efficiently than in the gas turbine itself.",name:'HRSG duct burners',desc:'Supplementary firing in the heat-recovery boiler',fx:{max:70,cost:.05},cost:.8e6},
       {id:'ob',learn:"A conventional HRSG has thick-walled steam drums that must warm slowly to avoid thermal stress. A once-through (drumless) design boils water inside the tubes themselves, so it tolerates fast temperature changes: quicker starts and faster ramps.",name:'Once-through HRSG',desc:'Drumless boiler design that handles fast temperature swings',fx:{start:-.5,ramp:.4},cost:1.1e6},
       {id:'stx',learn:"The steam turbine turns the HRSG’s steam into the plant’s ‘free’ extra third of output. Retrofitting it with modern blading and better seals extracts more power from the same steam, lifting the whole plant’s efficiency.",name:'Steam turbine retrofit',desc:'Modern blading and seals on the bottoming cycle',fx:{max:25,cost:-.1},cost:1.0e6},
       {id:'chill',learn:"Like fogging on a peaker, inlet chillers cool the gas turbine’s intake air, here with a refrigeration plant so it works even on humid days. Denser air means more mass flow through the gas turbine, and more exhaust heat for the HRSG too.",name:'Inlet air chillers',desc:'Mechanical chilling of turbine intake air',fx:{max:40},cost:.7e6},
       {id:'cond',learn:"The steam turbine exhausts into a condenser. The colder the condenser, the lower the back-pressure and the more energy the turbine can extract. A bigger cooling tower or condenser cleaning system improves vacuum and squeezes out a bit more power per unit of fuel.",name:'Condenser & cooling-tower upgrade',desc:'Better vacuum on the steam turbine exhaust',fx:{max:15,cost:-.04},cost:.5e6}],
  hydro:[{id:'runner',learn:'The runner is the wheel the water pushes against. Modern runners shaped with computer flow modeling turn more of the water’s energy into rotation, so each acre-foot of water makes more MWh.',name:'Turbine runner replacement',desc:'More MWh from every drop of water',fx:{water:-.2},cost:.7e6},
         {id:'pen',learn:'The penstock is the big pipe from the reservoir to the turbine. Friction in it wastes head (pressure). A larger penstock loses less and passes more flow, which raises the maximum output.',name:'Upsized penstock',desc:'More water flow to the turbines',fx:{max:60},cost:1.0e6},

      if(st.bats[st.bats.length-1].lvl>=5){st.bats.push(newBat());done.push('<b>New battery: Battery '+st.bats.length+' (level 1)</b>')}

   <div class="pn u" style="grid-column:1/-1"><div class="h"><span class="nm">Customer load shed</span><span class="num" id="shedt">0 MW</span></div>
   <div class="note">Under-frequency relays drop 150 MW blocks below 59.3 Hz. Each unserved MWh costs $1,000. Restore when you have the generation.</div>
   <div class="row"><button class="btn sm" id="restore">Restore 150 MW</button></div></div>`;
  document.querySelectorAll('[data-sp]').forEach(el=>el.oninput=()=>{st.u[el.dataset.sp].sp=+el.value});
  document.querySelectorAll('[data-upg]').forEach(el=>el.onclick=()=>openUpgrades(el.dataset.upg,null));
  setTab(st.tab||'base');
  document.querySelectorAll('[data-start]').forEach(el=>el.onclick=()=>{
    const k=el.dataset.start,u=st.u[k],c=TYPES[u.type],nm=u.name||c.name;
    if(u.s==='dmg'){if(st.money<u.rc){alarm('w','Not enough money to repair '+nm);return}
      st.money-=u.rc;u.s='rep';u.tmr=repTime(u);alarm('','Repair crew dispatched to '+nm);return}
    if(!c.start)return;
    if(u.s==='off'){const sc=ustartCost(u);u.s='start';u.tmr=ustart(u);u.p=0;st.money-=sc;alarm('','Starting '+nm+' (−$'+Math.round(sc/100)/10+'k)')}
    else if(u.s==='on'||u.s==='start'){u.s='off';alarm('','Stopping '+nm)}
  });
  $('curts').checked=!!st.curtS;$('curts').onchange=e=>st.curtS=e.target.checked;
  if($('curtw')){$('curtw').checked=!!st.curtW;$('curtw').onchange=e=>st.curtW=e.target.checked}
  document.querySelectorAll('[data-agc]').forEach(el=>el.onchange=()=>{const u=st.u[el.dataset.agc];if(u)u.agc=el.checked});
  document.querySelectorAll('[data-bauto]').forEach(el=>el.onchange=()=>st.bats[+el.dataset.bauto].auto=el.checked);
  document.querySelectorAll('[data-bsp]').forEach(el=>el.oninput=()=>st.bats[+el.dataset.bsp].sp=+el.value);
  if(st.exp){$('tiesp').oninput=e=>st.exp.man=+e.target.value;$('tieauto').onchange=e=>st.exp.auto=e.target.checked;$('tiecut').onchange=e=>st.exp.cut=e.target.checked}
  $('restore').onclick=()=>{if(st.shed>0){st.shed=Math.max(0,st.shed-150);alarm('','Restored 150 MW of customers')}};
}
const netBal=()=>(st.gen||0)-(st.served||0)-(st.ex||0);
function setTab(t){st.tab=t;$('units').dataset.tab=t;document.querySelectorAll('.tab').forEach(b=>{const on=b.dataset.tab===t;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)})}
function render(){
  {const w={base:0,swing:0,green:(st.solar||0)+(st.windP||0)};for(const k in st.u){const u=st.u[k];w[TAB[u.type]]+=u.p}
   for(const t in w)$('tw-'+t).textContent=Math.round(w[t])+' MW'}
  $('dayl').textContent='Day '+st.day;$('clock').textContent=fmt(st.t);
  $('srt').textContent=fmt(st.sr||6);$('sst').textContent=fmt(st.ss||19);
  $('sunl').textContent='Sun '+fmt(st.sr||6)+'–'+fmt(st.ss||19);
  {const dv=Math.abs(st.f-60),bf=$('bf');bf.textContent=st.f.toFixed(2);bf.className='num'+(dv>.7?' a':dv>.2?' w':'');
   const bl=Math.round(netBal());$('bb').textContent=(bl>0?'+':bl<0?'−':'')+Math.abs(bl)}$('money').textContent=money(st.money);
  const f=st.f,dev=Math.abs(f-60);
  $('fz').textContent=f.toFixed(2)+' Hz';$('fz').className='fz num'+(dev>.7?' a':dev>.2?' w':'');
  $('kd').textContent=Math.round(st.load||0)+' MW';$('kg').textContent=Math.round(st.gen||0)+' MW';
  const bal=Math.round(netBal());$('kb').textContent=(bal>0?'+':'')+bal+' MW';
  $('ks').textContent=st.shed+' MW';$('shedt').textContent=st.shed+' MW';$('restore').disabled=!st.shed;
  for(const k in st.u){const u=st.u[k],c=TYPES[u.type];
    $('mw-'+k).innerHTML=Math.round(u.p)+'<small> / '+umax(u)+' MW</small>';
    $('sp-'+k).textContent=u.s==='on'?'Setpoint '+Math.round(u.sp)+' MW':u.s==='start'?'Starting… '+Math.ceil(u.tmr)+' s':u.s==='trip'?'Tripped. Reset in '+Math.ceil(u.tmr)+' s':u.s==='build'?'Ready tomorrow':u.s==='dmg'?'Damaged: needs repair':u.s==='rep'?'Repairing… '+Math.ceil(u.tmr)+' s':'Offline';
    const ch=$('ch-'+k);ch.textContent=u.s==='on'?'ONLINE':u.s==='start'?'STARTING':u.s==='trip'?'TRIPPED':u.s==='build'?'BUILDING':u.s==='dmg'?'DAMAGED':u.s==='rep'?'REPAIR':'OFF';
    ch.className='chip'+(u.s==='start'||u.s==='rep'?' st':u.s==='trip'||u.s==='dmg'?' trip':'');
    const sb=document.querySelector(`[data-start="${k}"]`);
    if(sb){const show=c.start||u.s==='dmg'||u.s==='rep';sb.style.display=show?'':'none';
      sb.textContent=u.s==='dmg'?'Repair ('+money(u.rc)+')':u.s==='rep'?'Repairing':u.s==='off'?'Start (−$'+Math.round(ustartCost(u)/100)/10+'k)':u.s==='trip'?'Locked out':u.s==='build'?'Building':'Stop';
      sb.disabled=u.s==='trip'||u.s==='build'||u.s==='rep'||(u.s==='dmg'&&st.money<u.rc);sb.classList.toggle('pri',u.s==='dmg')}
    const sl=document.querySelector(`[data-sp="${k}"]`);if(u.agc)sl.value=u.sp;sl.disabled=!!u.agc||u.s==='build';
  }
  if($('resb')){$('resb').style.width=Math.min(100,st.res/st.resCap*100)+'%';$('rest').textContent=Math.round(st.res)+' / '+st.resCap+' MWh'}
  $('mw-sol').innerHTML=Math.round(st.solar||0)+'<small> MW</small>';
  $('ch-sol').textContent=st.solarCap<=0?'DESTROYED':st.curtS?'CURTAILED':st.smoke?'SMOKE':sun(st.t)<=0?'NIGHT':st.cloud<.7?'CLOUDY':'SUN';
  if($('mw-wind')){$('mw-wind').innerHTML=Math.round(st.windP||0)+'<small> / '+st.windCap+' MW</small>';$('windb').style.width=(st.wind*100)+'%';
    $('ch-wind').textContent=st.ice?'ICED':st.curtW?'CURTAILED':st.wind<.25?'CALM':st.wind>.65?'STRONG':'STEADY';
    $('wavail').textContent=Math.round(st.windCap*st.wind)+' MW'}
  let tS=0,tC=0,tP=0;
  st.bats.forEach((b,i)=>{tS+=b.soc;tC+=b.cap;tP+=b.p;
    $('mw-bat'+i).innerHTML=(b.p>0?'+':'')+Math.round(b.p)+'<small> MW</small>';
    $('sp-bat'+i).textContent=b.auto?'Auto mode':'Setpoint '+(b.sp>0?'+':'')+b.sp+' MW';
    document.querySelector(`[data-bsp="${i}"]`).disabled=b.auto;
    $('socb'+i).style.width=(b.soc/b.cap*100)+'%';$('soct'+i).textContent=Math.round(b.soc)+' / '+b.cap+' MWh';
    $('ch-bat'+i).textContent=b.p>5?'DISCHG':b.p<-5?'CHARGE':'IDLE'});
  {const pc=tC?tS/tC:0,el=$('bsoc');el.textContent=tC?Math.round(pc*100)+'%':'—';el.className='num'+((pc>.85&&tP<-5)||(pc<.15&&tP>5)?' w':'')}
  if(st.exp&&$('tie-p')){const E=st.exp,c=contractAt(st.t),nx=priceAt((st.t+1)%24);
    $('tie-p').textContent='$'+(st.price||priceAt(st.t));$('tie-f').textContent=(E.flow>=0?'+':'−')+Math.abs(Math.round(E.flow))+' MW';
    $('tie-c').textContent=c?c+' MW':'—';
    $('ch-tie').textContent=E.flow>5?'EXPORT':E.flow<-5?'IMPORT':'IDLE';
    $('tie-n').textContent=(c?`Contract delivering until 21:00${E.cut?' (CUT: paying penalties)':''}. `:`Next contract: ${contractMW(st.day)} MW, ramping in from 15:30. `)+`Next hour $${nx}/MWh · tie ${E.cap} MW · today: contract ${money(st.dayStats.contract||0)}, sold ${money(st.dayStats.sold||0)}, bought ${money(st.dayStats.bought||0)}${(st.dayStats.pen||0)>1?', penalties '+money(st.dayStats.pen):''}`;
    if(E.auto)$('tiesp').value=Math.round(E.tr||0);$('tiesp').disabled=!!E.auto}
  $('lgex').textContent=st.exp?' + exports':'';
  drawGauge();drawTrend();drawAlarm();outlook();
  $('pause').textContent=st.paused?'Run':'Pause';$('spd').textContent=(st.speed===.5?'½':st.speed)+'×';$('spd').classList.toggle('slow',!!st.autoSlow);
}
function drawAlarm(){const a=st.alarm,el=$('alarm');const cls='pn alarm'+(a.lvl?' '+a.lvl:'');
  if(el.className!==cls)el.className=cls;el.querySelector('.tag').textContent=a.lvl==='a'?'ALARM':a.lvl==='w'?'WARN':'INFO';$('amsg').textContent=a.msg}
const ang=f=>Math.PI*(1-(Math.max(59,Math.min(61,f))-59)/2);
const pt=(a,r)=>[100+r*Math.cos(a),100-r*Math.sin(a)];
function arc(f1,f2,col,w){const a=pt(ang(f1),80),b=pt(ang(f2),80);return `<path d="M${a[0].toFixed(1)} ${a[1].toFixed(1)}A80 80 0 0 1 ${b[0].toFixed(1)} ${b[1].toFixed(1)}" fill="none" stroke="${col}" stroke-width="${w}"/>`}
function drawGauge(){
  const ln=col('--ln'),ink=col('--ink'),dim=col('--dim');
  let s=arc(59,61,ln,14)+arc(59,59.3,'#d42f1f',14)+arc(60.7,61,'#d42f1f',14)+arc(59.3,59.8,'#e2ad00',14)+arc(60.2,60.7,'#e2ad00',14);
  for(const v of [59,59.5,60,60.5,61]){const a=pt(ang(v),96),b=pt(ang(v),88);s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${dim}" stroke-width="1.5"/>`}
  const n=pt(ang(st.f),70);s+=`<line x1="100" y1="100" x2="${n[0].toFixed(1)}" y2="${n[1].toFixed(1)}" stroke="${ink}" stroke-width="4" stroke-linecap="round"/><circle cx="100" cy="100" r="7" fill="${ink}"/>`;
  s+=`<text x="12" y="111" font-size="11" fill="${dim}">59</text><text x="176" y="111" font-size="11" fill="${dim}">61</text>`;
  $('gsv').innerHTML=s;
}
const cv=$('cv');
const probe=document.createElement('span');probe.style.display='none';document.body.appendChild(probe);
function col(v){probe.style.color=`var(${v})`;return getComputedStyle(probe).color}
function drawTrend(){
  const W=cv.clientWidth,H=cv.clientHeight,dpr=window.devicePixelRatio||1;
  if(cv.width!==W*dpr){cv.width=W*dpr;cv.height=H*dpr}
  const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
  const h=st.hist;if(h.length<2)return;
  const css=getComputedStyle(document.documentElement);
  const fc=[];for(let j=0;j<=60;j++){const tt=st.t+j*.05;const cx=contractAt(tt%24)+(st.exp?st.exp.tr||0:0);fc.push([demand(tt%24)+cx,demand(tt%24)+cx-solarAt(tt%24)-(st.windP||0)])}
  let lo=Infinity,hi=-Infinity;for(const [a,b] of h){lo=Math.min(lo,a,b);hi=Math.max(hi,a,b)}
  for(const [a,b] of fc){lo=Math.min(lo,a,b);hi=Math.max(hi,a,b)}
  lo-=40;hi+=40;const off=140-h.length,X=i=>(i+off)/200*W,Y=v=>H-6-(v-lo)/(hi-lo)*(H-12),XF=j=>(140+j)/200*W;
  x.strokeStyle=col('--ln');x.lineWidth=1;x.fillStyle=col('--dim');x.font='11px sans-serif';
  for(const v of [lo+40,hi-40]){x.beginPath();x.moveTo(0,Y(v));x.lineTo(W,Y(v));x.stroke();x.fillText(Math.round(v)+' MW',4,Y(v)-3)}
  for(const [j,c] of [[0,'--ink'],[1,'--blue']]){x.strokeStyle=col(c);x.lineWidth=2;x.beginPath();
    h.forEach((p,i)=>i?x.lineTo(X(i),Y(p[j])):x.moveTo(X(i),Y(p[j])));x.stroke()}
  x.strokeStyle=col('--ln');x.lineWidth=1;x.beginPath();x.moveTo(XF(0),0);x.lineTo(XF(0),H);x.stroke();
  x.fillStyle=col('--dim');x.fillText('now',XF(0)+3,11);
  x.setLineDash([5,4]);
  for(const [j,c] of [[0,'--ink'],[1,'--blue']]){x.strokeStyle=col(c);x.lineWidth=2;x.beginPath();
    fc.forEach((p,i)=>i?x.lineTo(XF(i),Y(p[j])):x.moveTo(XF(i),Y(p[j])));x.stroke()}
  x.setLineDash([]);
}
function outlook(){
  const t=st.t,dD=demand((t+1)%24)+contractAt((t+1)%24)-demand(t)-contractAt(t),dS=solarAt((t+1)%24)-solarAt(t),need=dD-dS;
  const sg=v=>{const n=Math.round(v/5)*5;return (n>0?'+':n<0?'−':'')+Math.abs(n)+' MW'};
  $('o-d').textContent=sg(dD);$('o-s').textContent=sg(dS);$('o-n').textContent=sg(need);
  const dis=st.bats.reduce((a,b)=>a+Math.max(0,b.p),0),soc=st.bats.reduce((a,b)=>a+b.soc,0);
  let bt='Battery not covering any shortfall';
  if(dis>20){const hrs=soc/dis;bt=`Battery covering ${Math.round(dis/10)*10} MW · empty in ~${hrs<1?Math.round(hrs*60)+' min':hrs.toFixed(1)+' h'}`}
  $('o-b').textContent=bt;
}
function showOv(html){$('ovc').innerHTML=html;$('ov').classList.add('on')}
function hideOv(){$('ov').classList.remove('on')}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function save(){if(!st.over){st.savedAt=Date.now();store('go-state',st)}}
function intro(resume){
  showOv(`<h2>${resume?'Shift paused':'Grid Operator'}</h2>
  <p>You run a small power grid. Match generation to customer demand and keep frequency at <b>60 Hz</b>.</p>
  <ul><li>Too little generation: frequency sags. Below 59.3 Hz relays shed customers. Below 59 Hz: blackout.</li>
  <li>Too much: frequency climbs. Above 61 Hz: blackout.</li>
  <li>Move the setpoint sliders, or tick <b>AGC</b> on a unit to let it follow demand automatically. The dashed lines and the “Next hour” line show what’s coming, including solar fading at sunset.</li>
  <li>Watch for clouds, unit trips and heat waves. Each day demand grows. From day 5, natural disasters can damage or destroy plants.</li>
  <li>Speed button cycles ½×, 1×, 2×, 3×. If the power balance passes ±100 MW the game drops to ½× on its own, and returns to 1× once you’re back within ±30 MW for a few seconds.</li>
  <li>Plants are grouped in tabs: <b>Base load</b> (nuclear, coal), <b>Swing</b> (gas turbines, combined cycle) and <b>Green</b> (hydro, solar, wind). Batteries show on every tab.</li>
  <li>Earn $60 per MWh delivered, minus fuel. Spend it on new plants with <b>Build</b>. They come online the next morning.</li>
  <li><b>Real time:</b> when you close the app, the grid keeps running at 1 game hour per real hour (up to 3 days) on autopilot. It repairs damage and can’t black out, but it’s costlier than you. You get a report when you come back.</li>
  <li><b>Day 30, The Expansion:</b> a tie line to the regional market, hourly prices, and a firm evening delivery contract that grows every day.</li>
  <li>Survive as many days as you can. Rumor has it there’s a way to win…</li></ul>
  <p class="note">Best run: ${st.best} day${st.best===1?'':'s'}. Pauses itself if you switch apps. v0.81: Project Infinite.</p>
  <label class="tog"><input type="checkbox" id="aslow" ${st.autoSlowOn!==false?'checked':''}> Auto slow-motion: drop to ½× speed when the power balance passes ±100 MW</label>
  <button class="btn pri" id="go">${resume?'Resume':'Start shift'}</button>`);
  $('aslow').onchange=e=>st.autoSlowOn=e.target.checked;
  $('go').onclick=()=>{if(resume){hideOv();st.paused=false;st.phase='run'}else begin()};
}
$('pause').onclick=()=>{if(st.phase!=='run'&&st.phase!=='pause')return;st.paused=!st.paused;st.phase=st.paused?'pause':'run';if(st.paused)save()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
new ResizeObserver(()=>document.documentElement.style.setProperty('--barh',document.querySelector('.topbar').offsetHeight+'px')).observe(document.querySelector('.topbar'));
$('build').onclick=()=>{if(st.phase==='run'||st.phase==='pause')openShop(null)};
$('spd').onclick=()=>{const L=[.5,1,2,3];st.speed=L[(L.indexOf(st.speed)+1)%L.length];st.autoSlow=false;okT=0};
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(st.phase==='run'){st.paused=true;st.phase='pause';intro(true)}if(st.phase!=='intro')save()}
  else if(st.savedAt)catchUp(Date.now()-st.savedAt);
});
new ResizeObserver(()=>drawTrend()).observe($('trend'));

function loop(now){
  let dt=Math.min(.25,(now-last)/1000);last=now;
  if(!st.paused&&!st.over){acc+=dt*st.speed;while(acc>=.05&&!st.paused&&!st.over){step(.05);acc-=.05}
    // auto slow-motion: drop to ½× when the power balance passes ±100 MW, back to 1× after 3 s within ±30 MW
    const bal=netBal(),imb=Math.abs(bal);
    if(st.autoSlowOn!==false&&!st.autoSlow&&st.speed>.5&&imb>=100){st.autoSlow=true;st.speed=.5;okT=0;alarm('w','Slowing to ½× speed: balance '+(bal>0?'+':'')+Math.round(bal)+' MW')}
    if(st.autoSlow){okT=imb<30?okT+dt:0;if(okT>3){st.autoSlow=false;st.speed=1;alarm('','Conditions normal. Back to 1× speed')}}}else acc=0;
  if(st.phase!=='intro'&&!st.over){saveT+=dt;if(saveT>5){saveT=0;save()}}
  render();requestAnimationFrame(loop);
}
const best=store('go-best')||0,saved=store('go-state');
if(saved&&saved.u&&!saved.over){st=Object.assign(fresh(best),saved);for(const k in st.u)st.u[k].type=st.u[k].type||k;if(!saved.bats&&saved.bat){const lv=1+Math.max(0,(saved.built&&saved.built.bat||0)-(saved.pending||[]).filter(x=>x==='bat').length);st.bats=[Object.assign(newBat(),saved.bat,{mw:saved.batMW||200,cap:saved.batCap||300,lvl:lv})];delete st.bat}
  if(!saved.cnt){for(const id in st.built){const f=FAM[id];st.cnt[f]=(st.cnt[f]||0)+st.built[id]}for(const id of st.pending)st.cnt[FAM[id]]--;for(const k in st.u)if(st.u[k].s==='build')st.cnt[FAM[st.u[k].type]]--}
  if(saved.windOut===undefined)st.windOut=st.curtW?0:st.windCap*st.wind;st.best=Math.max(best,st.best||0);st.paused=true;buildUnits();
  if(!catchUp(Date.now()-(saved.savedAt||Date.now()))){if(saved.phase==='day'){st.phase='run';intro(true)}else intro(true)}}
else{st=fresh(best);st.load=demand(st.t);st.served=st.load;st.gen=st.load;buildUnits();intro(false)}
requestAnimationFrame(loop);
}
</script>
